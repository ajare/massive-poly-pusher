RenderGraph:
  Images:
    - name: ShadowDepth
      format: DEPTH24
      depthCompare: true
      usage: depthAttachment,sampled
      import: shadowDepth
      external: true
      transient: false
    - name: SceneHdr
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: SceneDepth
      format: DEPTH24
      usage: depthAttachment,sampled
    - name: BloomExtract
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPing0
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPong0
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPing1
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPong1
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPing2
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPong2
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPing3
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomPong3
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
    - name: BloomComposite
      format: RGBA16F
      usage: colourAttachment,sampled
      colourSpace: LINEAR
    - name: Presentation
      format: RGBA8
      usage: colourAttachment,presentation
      import: screen
      external: true
      transient: false
    - name: ParticleOitAccumulation
      format: RGBA16F
      usage: colourAttachment,sampled
    - name: ParticleOitOpticalDepth
      format: R16F
      usage: colourAttachment,sampled
  Passes:
    - name: ShadowDepth
      type: scene
      factory: MPP.ShadowDepth
      Depth:
        image: ShadowDepth
        load: clear
        store: store
        clear: 1
    - name: PbrScene
      type: scene
      factory: MPP.PbrScene
      Inputs:
        - sampler: SHADOW_MAP
          image: ShadowDepth
      Colours:
        - image: SceneHdr
          load: clear
          store: store
          clear: 0 0 0 1
      Depth:
        image: SceneDepth
        load: clear
        store: store
        clear: 1
    - name: ParticleWeightedOit
      type: scene
      factory: MPP.ParticleWeightedOit
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Colours:
        - image: ParticleOitAccumulation
          load: clear
          store: store
          clear: 0 0 0 0
        - image: ParticleOitOpticalDepth
          load: clear
          store: store
          clear: 0 0 0 0
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: one
        destinationColourBlend: one
        sourceAlphaBlend: one
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleWeightedOitResolve
      type: fullscreen
      factory: MPP.ParticleWeightedOitResolve
      Inputs:
        - sampler: SCENE
          image: SceneHdr
        - sampler: ACCUMULATION
          image: ParticleOitAccumulation
        - sampler: OPTICAL_DEPTH
          image: ParticleOitOpticalDepth
      Colours:
        - image: SceneHdr
          load: dontCare
          store: store
    - name: ParticleAlpha
      type: scene
      factory: MPP.ParticleScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 1
      Colours:
        - image: SceneHdr
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: oneMinusSourceAlpha
        sourceAlphaBlend: one
        destinationAlphaBlend: oneMinusSourceAlpha
        multisample: false
    - name: ParticleAdditive
      type: scene
      factory: MPP.ParticleScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 0
      Colours:
        - image: SceneHdr
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: one
        sourceAlphaBlend: zero
        destinationAlphaBlend: one
        multisample: false
    - name: BloomExtract
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomExtract
      Inputs:
        - sampler: TEX1
          image: SceneHdr
      Colours:
        - image: BloomExtract
          load: dontCare
          store: store
    - name: BloomBlurHorizontal0
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurHorizontal
      Inputs:
        - sampler: TEX1
          image: BloomExtract
      Colours:
        - image: BloomPing0
          load: dontCare
          store: store
    - name: BloomBlurVertical0
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurVertical
      Inputs:
        - sampler: TEX1
          image: BloomPing0
      Colours:
        - image: BloomPong0
          load: dontCare
          store: store
    - name: BloomBlurHorizontal1
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurHorizontal
      Inputs:
        - sampler: TEX1
          image: BloomPong0
      Colours:
        - image: BloomPing1
          load: dontCare
          store: store
    - name: BloomBlurVertical1
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurVertical
      Inputs:
        - sampler: TEX1
          image: BloomPing1
      Colours:
        - image: BloomPong1
          load: dontCare
          store: store
    - name: BloomBlurHorizontal2
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurHorizontal
      Inputs:
        - sampler: TEX1
          image: BloomPong1
      Colours:
        - image: BloomPing2
          load: dontCare
          store: store
    - name: BloomBlurVertical2
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurVertical
      Inputs:
        - sampler: TEX1
          image: BloomPing2
      Colours:
        - image: BloomPong2
          load: dontCare
          store: store
    - name: BloomBlurHorizontal3
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurHorizontal
      Inputs:
        - sampler: TEX1
          image: BloomPong2
      Colours:
        - image: BloomPing3
          load: dontCare
          store: store
    - name: BloomBlurVertical3
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomBlurVertical
      Inputs:
        - sampler: TEX1
          image: BloomPing3
      Colours:
        - image: BloomPong3
          load: dontCare
          store: store
    - name: BloomComposite
      type: fullscreen
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.BloomComposite
      Inputs:
        - sampler: SCENE
          image: SceneHdr
        - sampler: BLOOM
          image: BloomPong3
      Colours:
        - image: BloomComposite
          load: dontCare
          store: store
    - name: ToneMapPresentation
      type: present
      factory: MPP.FullscreenEffect
      program: DemoSuite.PostEffect.ToneMap
      Inputs:
        - sampler: TEX1
          image: BloomComposite
      Colours:
        - image: Presentation
          load: clear
          store: store
          clear: 0 0 0 1