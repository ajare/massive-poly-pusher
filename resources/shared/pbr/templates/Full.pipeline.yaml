PbrPipeline:
  version: 1
  name: Full PBR Pipeline
  PreviewScene:
    file: ../DefaultPbrPreview.scene.yaml
  ResourceLibraries:
    - file: ../PbrPreviewResources.yaml
  LocalResources:
    PbrMaterial:
      name: Preview.LocalPbr
      MeshSpecification:
        primitive: triangles
        indexed: true
        storage: static
        Buffer:
          - data: position3
            type: float32
          - data: normal3
            type: float32
          - data: texcoord2
            type: float32
          - data: colour4
            type: float32
            normalised: true
          - data: tangent4
            type: float32
      Surface:
        baseColourFactor: 0.72 0.76 0.82 1
        metallicFactor: 0
        roughnessFactor: 0.65
        emissiveFactor: 0 0 0
        normalScale: 1
        occlusionStrength: 1
        alphaMode: OPAQUE
        alphaCutoff: 0.5
        doubleSided: false
    Texture:
      - name: Preview.Environment
        target: CUBEMAP
        filename: ../arrow.png
        colourSpace: SRGB
        mipmaps: true
        minFilter: LINEAR_MIPMAP_LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: Preview.BrdfLut
        target: 2D
        filename: ../arrow.png
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
    Sampler:
      name: Preview.LocalSampler
      minFilter: LINEAR
      magFilter: LINEAR
      wrap: CLAMP_TO_EDGE
      maxAnisotropy: 1
    PostEffectMaterial:
      - name: PostEffect.BloomExtract
        Program:
          Ref: __mpp_p2d_bloom_extract__
        SamplerSlots:
          - TEX1
        Uniforms:
          - name: THRESHOLD
            type: float
            value: 0.7
      - name: PostEffect.BloomBlurHorizontal
        Program:
          Ref: __mpp_p2d_bloom_blur__
        SamplerSlots:
          - TEX1
        Uniforms:
          - name: DIRECTION
            type: vec2
            value: 1 0
      - name: PostEffect.BloomBlurVertical
        Program:
          Ref: __mpp_p2d_bloom_blur__
        SamplerSlots:
          - TEX1
        Uniforms:
          - name: DIRECTION
            type: vec2
            value: 0 1
      - name: PostEffect.BloomComposite
        Program:
          Ref: __mpp_p2d_bloom_combine__
        SamplerSlots:
          - SCENE
          - BLOOM
        Uniforms:
          - name: INTENSITY
            type: float
            value: 0.2
      - name: PostEffect.ToneMap
        Program:
          Ref: __mpp_p2d_tonemap__
        SamplerSlots:
          - TEX1
        Uniforms:
          - name: EXPOSURE
            type: float
            value: 1
          - name: TONE_MAP_OPERATOR
            type: int
            value: 1
  Imports:
    - id: shadowDepth
      semantic: shadowDepth
      format: DEPTH24
      usage: depthAttachment,sampled
      required: true
    - id: screen
      semantic: presentation
      format: RGBA8
      usage: colourAttachment,presentation
      required: true
  Outputs:
    - name: Main
      image: Presentation
      taaDepth: SceneDepth
      AntiAliasing:
        msaa: inherit
        ssaa: inherit
        taa: inherit
        fxaa: inherit
  Environment:
    binding: Preview.Environment
    irradiance: Preview.Environment
    prefilteredSpecular: Preview.Environment
    brdfLut: Preview.BrdfLut
    background: Preview.Environment
  Bloom:
    enabled: true
    blurPasses: 4
  PreviewBindings:
    - binding: Preview.Main
      resource: Preview.LocalPbr
    - binding: Preview.Spheres
      resource: Preview.LocalPbr
    - binding: Preview.Ground
      resource: Preview.LocalPbr
  PreviewOverrides:
    - model: Sphere.0.0
      binding: Preview.Main
      Values:
        Float:
          name: PBR_ROUGHNESS_FACTOR
          value: 0.35
        Vec4:
          name: PBR_BASE_COLOUR_FACTOR
          value: 1 0.8 0.6 1
  Extensions:
    Extension:
      namespace: urn:mpp:editor-metadata:1
      Payload:
        EditorMetadata:
          category: Full PBR
  RenderGraph:
    Images:
      - name: ShadowDepth
        format: DEPTH24
        usage: depthAttachment,sampled
        import: shadowDepth
        external: true
        transient: false
      - name: SceneHdr
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: SceneEmissive
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: SceneDepth
        format: DEPTH24
        usage: depthAttachment,sampled
      - name: SceneColourResolved
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        mipLevels: 5
        minFilter: LINEAR_MIPMAP_LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomExtract
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPing0
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPong0
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPing1
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPong1
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPing2
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPong2
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPing3
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomPong3
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
        minFilter: LINEAR
        magFilter: LINEAR
        wrap: CLAMP_TO_EDGE
      - name: BloomComposite
        format: RGBA16F
        usage: colourAttachment,sampled
        colourSpace: LINEAR
      - name: Presentation
        format: RGBA8
        usage: sampled,colourAttachment,presentation
        import: screen
        external: true
        transient: false
    Passes:
      - name: ShadowDepth
        type: scene
        factory: MPP.ShadowDepth
        Depth:
          image: ShadowDepth
          load: clear
          store: store
          clear: 1
      - name: PbrScene
        type: scene
        factory: MPP.PbrScene
        Inputs:
          - sampler: SHADOW_MAP
            image: ShadowDepth
        Colours:
          - image: SceneHdr
            load: clear
            store: store
            clear: 0 0 0 1
          - image: SceneEmissive
            load: clear
            store: store
            clear: 0 0 0 1
        Depth:
          image: SceneDepth
          load: clear
          store: store
          clear: 1
      # Water reads the shaded opaque scene while drawing into it, so it samples a
      # frozen copy rather than the live target. The copy declares a mip chain,
      # regenerated when this pass's target is popped, which is what the water
      # shader's roughness blur samples.
      - name: SceneColourCopy
        type: fullscreen
        factory: MPP.SceneColourCopy
        Inputs:
          - sampler: TEX1
            image: SceneHdr
        Colours:
          - image: SceneColourResolved
            load: dontCare
            store: store
      # Occlusion is resolved in the shader against the sampled depth buffer rather
      # than through a depth attachment: the graph gives each image version its own
      # physical target, so attaching what this pass samples would depth-test
      # against an uninitialized copy of it.
      - name: WaterScene
        type: scene
        factory: MPP.WaterScene
        Inputs:
          - sampler: PBR_SCENE_COLOUR_RESOLVED
            image: SceneColourResolved
          - sampler: PBR_SCENE_DEPTH
            image: SceneDepth
          - sampler: SHADOW_MAP
            image: ShadowDepth
        Colours:
          - image: SceneHdr
            load: load
            store: store
          - image: SceneEmissive
            load: load
            store: store
        Raster:
          explicit: true
          depthTest: false
          depthWrite: false
      - name: BloomExtract
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomExtract
        Inputs:
          - sampler: TEX1
            image: SceneEmissive
        Colours:
          - image: BloomExtract
            load: dontCare
            store: store
      - name: BloomBlurHorizontal0
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurHorizontal
        Inputs:
          - sampler: TEX1
            image: BloomExtract
        Colours:
          - image: BloomPing0
            load: dontCare
            store: store
      - name: BloomBlurVertical0
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurVertical
        Inputs:
          - sampler: TEX1
            image: BloomPing0
        Colours:
          - image: BloomPong0
            load: dontCare
            store: store
      - name: BloomBlurHorizontal1
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurHorizontal
        Inputs:
          - sampler: TEX1
            image: BloomPong0
        Colours:
          - image: BloomPing1
            load: dontCare
            store: store
      - name: BloomBlurVertical1
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurVertical
        Inputs:
          - sampler: TEX1
            image: BloomPing1
        Colours:
          - image: BloomPong1
            load: dontCare
            store: store
      - name: BloomBlurHorizontal2
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurHorizontal
        Inputs:
          - sampler: TEX1
            image: BloomPong1
        Colours:
          - image: BloomPing2
            load: dontCare
            store: store
      - name: BloomBlurVertical2
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurVertical
        Inputs:
          - sampler: TEX1
            image: BloomPing2
        Colours:
          - image: BloomPong2
            load: dontCare
            store: store
      - name: BloomBlurHorizontal3
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurHorizontal
        Inputs:
          - sampler: TEX1
            image: BloomPong2
        Colours:
          - image: BloomPing3
            load: dontCare
            store: store
      - name: BloomBlurVertical3
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomBlurVertical
        Inputs:
          - sampler: TEX1
            image: BloomPing3
        Colours:
          - image: BloomPong3
            load: dontCare
            store: store
      - name: BloomComposite
        type: fullscreen
        factory: MPP.FullscreenEffect
        program: PostEffect.BloomComposite
        Inputs:
          - sampler: SCENE
            image: SceneHdr
          - sampler: BLOOM
            image: BloomPong3
        Colours:
          - image: BloomComposite
            load: dontCare
            store: store
      - name: ToneMapPresentation
        type: present
        factory: MPP.FullscreenEffect
        program: PostEffect.ToneMap
        Inputs:
          - sampler: TEX1
            image: BloomComposite
        Colours:
          - image: Presentation
            load: clear
            store: store
            clear: 0 0 0 1