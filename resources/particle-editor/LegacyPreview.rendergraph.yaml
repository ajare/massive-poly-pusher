RenderGraph:
  Images:
    - name: Presentation
      format: RGBA8
      usage: colourAttachment,sampled,presentation
      import: screen
      external: true
      transient: false
    - name: SceneDepth
      format: DEPTH24
      usage: depthAttachment,sampled
    - name: ParticleDistortion
      format: RG16F
      usage: colourAttachment,sampled
    - name: ParticleOitAccumulation
      format: RGBA16F
      usage: colourAttachment,sampled
    - name: ParticleOitOpticalDepth
      format: R16F
      usage: colourAttachment,sampled
  Passes:
    - name: LegacyScene
      type: scene
      factory: MPP.LegacyScene
      Colours:
        - image: Presentation
          load: clear
          store: store
          clear: 0.025 0.035 0.055 1
      Depth:
        image: SceneDepth
        load: clear
        store: store
        clear: 1
    - name: ParticleMeshes
      type: scene
      factory: MPP.ParticleMeshScene
      Colours:
        - image: Presentation
          load: load
          store: store
      Depth:
        image: SceneDepth
        load: load
        store: store
      Raster:
        explicit: true
        cull: back
        depthTest: true
        depthWrite: true
        blend: false
    - name: ParticleVolumetricLighting
      type: scene
      factory: MPP.ParticleVolumetricLighting
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Colours:
        - image: Presentation
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: one
        destinationColourBlend: one
        sourceAlphaBlend: one
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleWeightedOit
      type: scene
      factory: MPP.ParticleWeightedOit
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Colours:
        - image: ParticleOitAccumulation
          load: clear
          store: store
          clear: 0 0 0 0
        - image: ParticleOitOpticalDepth
          load: clear
          store: store
          clear: 0 0 0 0
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: one
        destinationColourBlend: one
        sourceAlphaBlend: one
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleWeightedOitResolve
      type: fullscreen
      factory: MPP.ParticleWeightedOitResolve
      Inputs:
        - sampler: SCENE
          image: Presentation
        - sampler: ACCUMULATION
          image: ParticleOitAccumulation
        - sampler: OPTICAL_DEPTH
          image: ParticleOitOpticalDepth
      Colours:
        - image: Presentation
          load: dontCare
          store: store
    - name: ParticleAlpha
      type: scene
      factory: MPP.ParticleScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 1
      Colours:
        - image: Presentation
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: oneMinusSourceAlpha
        sourceAlphaBlend: one
        destinationAlphaBlend: oneMinusSourceAlpha
        multisample: false
    - name: TrailAlpha
      type: scene
      factory: MPP.TrailScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 1
      Colours:
        - image: Presentation
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: oneMinusSourceAlpha
        sourceAlphaBlend: one
        destinationAlphaBlend: oneMinusSourceAlpha
        multisample: false
    - name: TrailAdditive
      type: scene
      factory: MPP.TrailScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 0
      Colours:
        - image: Presentation
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: one
        sourceAlphaBlend: zero
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleAdditive
      type: scene
      factory: MPP.ParticleScene
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Parameters:
        Int:
          name: BLEND_MODE
          value: 0
      Colours:
        - image: Presentation
          load: load
          store: store
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: sourceAlpha
        destinationColourBlend: one
        sourceAlphaBlend: zero
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleDistortion
      type: scene
      factory: MPP.ParticleDistortion
      Inputs:
        - sampler: DEPTH
          image: SceneDepth
      Colours:
        - image: ParticleDistortion
          load: clear
          store: store
          clear: 0 0 0 0
      Raster:
        explicit: true
        cull: none
        depthTest: false
        depthWrite: false
        blend: true
        sourceColourBlend: one
        destinationColourBlend: one
        sourceAlphaBlend: one
        destinationAlphaBlend: one
        multisample: false
    - name: ParticleDistortionComposite
      type: fullscreen
      factory: MPP.ParticleDistortionComposite
      Inputs:
        - sampler: SCENE
          image: Presentation
        - sampler: DISTORTION
          image: ParticleDistortion
      Colours:
        - image: Presentation
          load: dontCare
          store: store
